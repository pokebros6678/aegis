# Cloudflare Tunnel → AEGIS (Next.js on localhost:3000)
#
# Canonical path on the VM: ~/aegis/cloudflare/config.yml  (copy this file to config.yml there)
#
# 1. Create a tunnel: cloudflared tunnel create aegis
# 2. Note the printed TUNNEL_ID and path to the credentials JSON under ~/.cloudflared/
# 3. Route DNS (domain must be on Cloudflare), e.g.:
#    cloudflared tunnel route dns aegis aegis.bi6calirp.xyz
#    cloudflared tunnel route dns aegis app.bi6calirp.xyz
# 4. cp config.example.yml config.yml && edit tunnel + credentials-file below
# 5. Run: cloudflared tunnel --config ~/aegis/cloudflare/config.yml run
#    or from ~/aegis: npm run tunnel
#
# See SETUP.md for full steps.

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /home/REPLACE_USER/.cloudflared/REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: aegis.bi6calirp.xyz
    service: http://127.0.0.1:3000
  - hostname: app.bi6calirp.xyz
    service: http://127.0.0.1:3000
  - service: http_status:404
